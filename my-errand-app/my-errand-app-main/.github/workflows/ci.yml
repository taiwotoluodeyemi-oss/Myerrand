name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root
        run: npm install
      - name: Syntax check server
        run: |
          node --check app.js
          node --check server.js
          for f in routes/*.js middleware/*.js utils/*.js; do node --check "$f"; done
      - name: Smoke tests
        run: node --test tests/smoke.test.js
        env:
          JWT_SECRET: ci-test-secret
          USE_MONGO: 'false'
      - name: Install client
        run: npm run install-client
      - name: Build client
        run: npm run build
