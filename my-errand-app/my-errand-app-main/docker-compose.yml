services:
  mariadb:
    image: mariadb:11.4
    container_name: my-errand-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-errandsplace}
      MARIADB_USER: ${MYSQL_USER:-errand_user}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-errand_dev_password}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/complete-schema.sql:/docker-entrypoint-initdb.d/01-complete-schema.sql:ro
      - ./database/wallet-system.sql:/docker-entrypoint-initdb.d/02-wallet-system.sql:ro
      - ./database/gift-card-system.sql:/docker-entrypoint-initdb.d/03-gift-card-system.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  mariadb_data:
